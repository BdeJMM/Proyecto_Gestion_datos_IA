name: Pipeline Bank Marketing

on:
  push:
    branches:
      - main
    paths:
      - "Evaluacion 2/**"   # Solo se dispara si cambia algo dentro de esa carpeta
  pull_request:
    branches:
      - main
    paths:
      - "Evaluacion 2/**"
  workflow_dispatch:        # También se puede lanzar manualmente desde GitHub

jobs:
  run-pipeline:
    name: Ejecutar Pipeline DataOps
    runs-on: ubuntu-latest

    steps:

      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cachear dependencias pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('Evaluacion 2/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependencias
        run: pip install -r "Evaluacion 2/requirements.txt"

      - name: Ejecutar pipeline
        working-directory: "Evaluacion 2"   # Cambia al directorio antes de correr
        run: |
          python pipeline_EV2.py \
            --fuente   02_bank.csv \
            --destino  data/processed/bank_work.csv \
            --respaldo data/backup/bank_backup.csv \
            --modelo   models/model.pkl \
            --db-url   sqlite:///data/bank.db

      - name: Guardar artefactos del pipeline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: |
            Evaluacion 2/reports/pipeline.log
            Evaluacion 2/models/model.pkl
          retention-days: 7
